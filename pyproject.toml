[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-idle-notifier"
version = "0.1.0"
description = "Monitor idle NVIDIA GPUs and send notifications, with optional auto job execution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GPU Idle Notifier Contributors" }]
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0",
]

[project.scripts]
gpu-idle-notifier = "gpu_idle_notifier.__main__:main"

[tool.setuptools]
packages = ["gpu_idle_notifier"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N818"]

[tool.black]
line-length = 100
target-version = ["py39"]
